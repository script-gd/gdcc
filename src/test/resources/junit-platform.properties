# Class-level parallel test execution: only classes annotated @Execution(CONCURRENT) enter the
# fork-join pool (heavy real-zig compiler integration tests); everything else stays sequential.
# The fixed pool size bounds concurrent zig build rounds; each round already parallelizes its
# translation units internally. Override on the CLI with
# -Djunit.jupiter.execution.parallel.config.fixed.parallelism=N when needed.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
